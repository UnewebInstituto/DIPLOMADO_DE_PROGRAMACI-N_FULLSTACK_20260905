<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1> Ejemplo de Formulario</h1>

    <form action="./ejemplo01_formularios.php" method="post" enctype="multipart/form-data">
        <table>
            <tr>
                <td>Nombre:</td>
                <td>
                    <input type="text" name="nombre" id="nombre" required>
                </td>
            </tr>
            <tr>
                <td>Edad:</td>
                <td>
                    <input type="number" 
                        name="edad" 
                        id="edad"
                        required
                        min="0"
                        max="120">
                </td>
            </tr>
            <tr>
                <td>Estatura:</td>
                <td>
                    <input type="number" 
                        name="estatura" 
                        id="estatura"
                        required
                        min="0"
                        step="">
                </td>
            </tr>

            <tr>
                <td>Fecha de nacimiento:</td>
                <td>
                    <input type="date" 
                        name="fechanac" 
                        id="fechanac"
                        required>
                </td>
            </tr>
            <tr>
                <td>Fecha Hora:</td>
                <td>
                    <input type="datetime" 
                        name="fechahora" 
                        id="fechahora"
                        required>
                </td>
            </tr>

            <tr>
                <td>Fecha y Hora Local:</td>
                <td>
                    <input type="datetime-local" name="fechahoralocal" id="fechahoralocal" required>
                </td>
            </tr>

            <tr>
                <td>Mes:</td>
                <td>
                    <input type="month" name="mes" id="mes" required>
                </td>
            </tr>

            <tr>
                <td>Semana:</td>
                <td>
                    <input type="week" name="semana" id="semana" required>
                </td>
            </tr>

            <tr>
                <td>Hora:</td>
                <td>
                    <input type="time" name="hora" id="hora" required>
                </td>
            </tr>

            <tr>
                <td>Sexo:</td>
                <td>
                    <input type="radio" name="sexo" id="sexo" value="F">Femenino
                    <input type="radio" name="sexo" id="sexo" value="M">Masculino
                </td>
            </tr>

            <tr>
                <td>Actividad:</td>
                <td>
                    <input type="checkbox" name="actividad[]" id="actividad" value="Estudia" checked>Estudia
                    <input type="checkbox" name="actividad[]" id="actividad" value="Trabaja">Trabaja
                    <input type="checkbox" name="actividad[]" id="actividad" value="Otra">Otra
                </td>
            </tr>

            <tr>
                <td>Nivel de Instrucción</td>
                <td>
                    <select name="nivel" id="nivel">
                        <option value="Primaria" selected>Primaria</option>
                        <option value="Secundaria">Secundaria</option>
                        <option value="Tecnico">Técnico</option>
                        <option value="Universitario">Universitario</option>
                        <option value="Superior">Superior</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Busqueda:</td>
                <td>
                    <input type="search" name="buscar" id="buscar">
                </td>
            </tr>

            <tr>
                <td>Url:</td>
                <td>
                    <input type="url" name="url" id="url" value="https://www.uneweb.edu.ve">
                </td>
            </tr>

            <tr>
                <td>Color:</td>
                <td>
                    <input type="color" name="color" id="color" required>
                </td>
            </tr>

            <tr>
                <td>Archivo Anexo:</td>
                <!-- Solo aplica si el metodo es Post -->
                <td>
                    <input type="file" name="archivo" id="archivo">
                </td>
            </tr>

            <tr>
                <td>Rango:</td>
                <td>
                    <input type="range" name="rango" id="rango" min="0" max="100" value="0" onchange="rango_salida.value=rango.value"><output name="rango_salida">0</output>
                </td>
            </tr>

            <tr>
                <td>Correo Electrónico</td>
                <td>
                    <input type="email" name="correo" id="correo" 
                    placeholder="tucorreo
                    " required>
                </td>
            </tr>

            <tr>
                <td>Clave Secreta:</td>
                <td>
                    <input type="password" name="clave" id="clave" required title="Ingrese un valor alfanumerico iniciando con una letra mayuscula una letra minuscula, al menos un numero y un caracter especial">
                </td>
            </tr>

            <tr>
                <td>Oculto:</td>
                <td> 
                    <input type="hidden" name="oculto" id="oculto" value="Este dato no se ve">
                </td>
            </tr>

            <tr>
                <td>Botones:</td>
                <td>
                    <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">
                </td>
            </tr>

        </table>
    </form>
    
</body>
</html>
