<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ejemplo de Formularios</h1>
    <!--
    <form action="./ejemplo01_formularios.php" method="get" enctype="multipart/form-data">
    -->
    <form action="./ejemplo01_formularios.php" method="post" enctype="multipart/form-data">
    <table>
        <tr>
            <td>nombre</td>
            <td>
                <input  type="text" 
                        name="nombre" 
                        id="nombre"
                        required>
            </td>
        </tr>
        <tr>
            <td>Edad</td>
            <td>
                <input  type="number" 
                        name="edad" 
                        id="edad"
                        min="0"
                        max="120"
                        required>
            </td>
        </tr>
        <tr>
            <td>estatura</td>
            <td>
                <input  type="number"  
                        name="estatura" 
                        id="estatura"
                        min="0"
                        step="0.01"
                        required>
            </td>
        </tr>
        <tr>
            <td>Fecha de nacimiento</td>
            <td>
                <input  type="date" 
                        name="fechanac" 
                        id=fechanac"
                        required>
            </td>
        </tr>
        <tr>
            <td>Fecha hora:</td>
            <td>
                <input  type="datetime" 
                        name="fechahora" 
                        id="fechahora"
                        required>
            </td>
        </tr>
        <tr>
            <td>Fecha hora local</td>
            <td>
                <input  type="datetime-local" 
                        name="fechahoralocal" 
                        id="fechahoralocal"
                        required>
            </td>
        </tr>
        <tr>
            <td>mes:</td>
            <td>
                <input  type="month" 
                        name="mes" 
                        id="mes"
                        required>
            </td>
        </tr>
        <tr>
            <td>Semana:</td>
            <td>
                <input  type="week" 
                        name="semana" 
                        id="semana"
                        required>
            </td>
        </tr>
        <tr>
            <td>Hora:</td>
            <td>
                <input  type="time" 
                        name="hora" 
                        id="hora"
                        required>
            </td>
        </tr>
        <tr>
            <td>Sexo:</td>
            <td>
                <input  type="radio" 
                        name="sexo" 
                        id="sexo" 
                        value="F"
                        checked>femenino

                <input  type="radio" 
                        name="sexo" 
                        id="sexo" 
                        value="M">masculino
            </td>
        </tr>
        <tr>
            <td>Actividad:</td>
            <td><input  type="checkbox" 
                        name="actividad[]" 
                        id="actividad" 
                        value="estudia"
                        checked
                        multiple>estudia

                <input  type="checkbox" 
                        name="actividad[]" 
                        id="actividad" 
                        value="trabaja"
                        multiple>trabaja

                <input  type="checkbox" 
                        name="actividad[]" 
                        id="actividad" 
                        value="otra"
                        multiple>otra
                    </td>
        </tr>
        <tr>
            <td>Nivel de Instruccion:</td>
            <td>
                <select name="Nivel" id="Nivel">
                    <option value="primaria" selected>primaria</option>
                    <option value="secundaria">secundaria</option>
                    <option value="tecnico">tecnico</option>
                    <option value="universitario">universitario</option>
                    <option value="superior">superior</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>busqueda:</td>
            <td>
                <input  type="search" 
                        name="buscar" 
                        id="buscar"
                        required>
            </td>
        </tr>
        <tr>
            <td>Url:</td>
            <td>
                <input  type="url" 
                        name="url" 
                        id="url" 
                        required 
                        value="https://www.google.com">
            </td>
        </tr>
        <tr>
            <td>Color:</td>
            <td><input  type="color" 
                        name="color" 
                        id="color" 
                        required>
            </td>
        </tr>
        <tr>
            <td>archivo anexo</td>
            <!--solo aplica si el metodo del fomularios es post, si se usa get el archivo no se envia-->
            <td>
                <input  type="file" 
                        name="archivo" 
                        id="archivo" 
                        required>
            </td>
        </tr>
        <tr>
            <td>rango:</td>
            <td>
                <input  type="range" 
                        name="rango" 
                        id="rango" 
                        min="0" 
                        max="100" 
                        value="0" 
                        onchange="rango_salida.value=rango.value">
                        <output name="rango_salida">0</output>
            </td>
        </tr>
        <tr>
            <td>correo Electrónico</td>
            <td>
                <input  type="email" 
                        name="correo" 
                        id="Correo"
                        placeholder="tu correo@gmail.com"
                        required>
            </td>
        </tr>
        <tr>
            <td>clave secreta:</td>
            <td>
                <input  type="password" 
                        name="clave" 
                        id="clave" 
                        required 
                        title="ingrese un valor alfanumerico iniciando con una letra mayuscula, el resto en minuscula, al menos un numero y un caracter especial">
            </td>
        </tr>
        <tr>
            <td>Oculto</td>
            <td>
                <input  type="hidden" 
                        name="Oculto" 
                        id="Oculto" 
                        value="este dato no se ve">
            </td>
        </tr>
        <tr>
            <td>botones</td>
            <td>
                <input type="submit" value="enviar">
                <input type="reset" value="borrar">
            </td>
        </tr>
    </table>
    </form>

</body>
</html>
